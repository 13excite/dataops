replicas: 1
persistence:
  enabled: true
  storageClass: "standard"
  size: 2Gi
rootUser: "minioadmin"
rootPassword: "minioadmin"
resources:
  requests:
    memory: 1Gi
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - minio.dataops
  path: /
consoleIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  path: /
  hosts:
    - console.minio.dataops
mode: standalone