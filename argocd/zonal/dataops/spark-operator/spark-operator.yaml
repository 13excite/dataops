apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spark-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  generators:
    - clusters: {}
  template:
    metadata:
      name: 'spark-operator'
    spec:
      project: default
      source:
        repoURL: 'https://kubeflow.github.io/spark-operator'
        chart: spark-operator
        targetRevision: 'v2.0.2'
        helm:
          values: |
            webhook:
              enabled: true
            
      destination:
        server: https://kubernetes.default.svc
        namespace: 'spark-operator'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
      ignoreDifferences:
        - kind: Namespace
          jsonPointers:
            - /metadata/labels