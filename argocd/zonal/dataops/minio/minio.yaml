apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: minio-standalone
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  generators:
    - clusters: {}
  template:
    metadata:
      name: 'minio-standalone'
    spec:
      project: default
      source:
        repoURL: 'https://charts.min.io'
        chart: minio
        targetRevision: '5.3.0'
        helm:
          values: |
            replicas: 1
            persistence:
              enabled: true
              storageClass: "standard"
              size: 2Gi
            rootUser: "minioadmin"
            rootPassword: "minioadmin"
            users:
              - accessKey: console
                secretKey: console123
                policy: consoleAdmin
              - accessKey: redwriteuser
                secretKey: redwriteuser123
                policy: readwrite
            buckets:
              - name: dataops
                policy: none
            resources:
              requests:
                memory: 1Gi
            ingress:
              enabled: true
              ingressClassName: nginx
              annotations:
                nginx.ingress.kubernetes.io/proxy-body-size: 50m
                nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"
                nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
              hosts:
                - minio.dataops
              path: /
            consoleIngress:
              enabled: true
              ingressClassName: nginx
              annotations:
                nginx.ingress.kubernetes.io/proxy-body-size: 50m
                nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"
                nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
              path: /
              hosts:
                - console.minio.dataops
            mode: standalone
      destination:
        server: https://kubernetes.default.svc
        namespace: 'minio'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - kind: CustomResourceDefinition
          group: apiextensions.k8s.io
          jsonPointers:
            - /spec/versions # Ignore changes to CRD versions
